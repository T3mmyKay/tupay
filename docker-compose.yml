services:
  app:
    build:
      context: .
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

  worker:
    build:
      context: .
    working_dir: /var/www/html
    command: >-
      sh -c 'until [ -f vendor/autoload.php ]; do sleep 1; done;
      php artisan queue:work --queue=settlements,default --sleep=1 --tries=5 --timeout=60'
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tupay
      POSTGRES_USER: tupay
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tupay -d tupay"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
