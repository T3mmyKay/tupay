name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tupay
          POSTGRES_USER: tupay
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tupay -d tupay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: tupay
      DB_USERNAME: tupay
      DB_PASSWORD: secret
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      FX_RATE_STATIC: "0.00450000"
      EAT_SIGNING_KEY: test-eat-signing-key-at-least-thirty-two-characters
      SETTLEMENT_WEBHOOK_SECRET: test-webhook-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pdo_pgsql, redis
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Report dependency advisories
        run: composer audit --format=summary

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed --force

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: PHPStan level 8
        run: composer analyse

      - name: Unit and integration tests
        run: vendor/bin/phpunit --exclude-group concurrency

      - name: Reset state for parallel test
        run: |
          php artisan migrate:fresh --seed --force
          redis-cli -h 127.0.0.1 FLUSHALL

      - name: Start multi-worker HTTP server
        run: |
          PHP_CLI_SERVER_WORKERS=12 php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/concurrency-server.log 2>&1 &
          echo $! > /tmp/tupay-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/concurrency-server.log
          exit 1

      - name: Parallel concurrency test
        env:
          CONCURRENCY_BASE_URL: http://127.0.0.1:8000
        run: vendor/bin/phpunit --group concurrency

      - name: Show server log on failure
        if: failure()
        run: cat storage/logs/concurrency-server.log || true

      - name: Upload concurrency log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-server-log
          path: storage/logs/concurrency-server.log
          if-no-files-found: ignore
